<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify your email — Fundukuzama</title>
<style>
  :root {
    --navy: #0D2B55; --navy-dk: #081A38; --gold: #F0C040; --teal: #0E6655;
    --off-white: #F4F1EA; --gray: #9AA5B1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--navy-dk);
    color: var(--off-white);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
  }
  .icon { font-size: 44px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 12px; }
  p { color: var(--gray); font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
  .btn {
    display: inline-block;
    background: var(--gold);
    color: var(--navy-dk);
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    border: none;
    cursor: pointer;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--gold);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner"></div>
  <h1>Verifying your email…</h1>
  <p>Just a moment.</p>
</div>
<script>
const API_BASE_URL = 'https://fundukuzama-backend.onrender.com';
async function verify() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const card = document.getElementById('card');
  if (!token) {
    card.innerHTML = `
      <div class="icon">⚠️</div>
      <h1>Missing verification link</h1>
      <p>This page needs a verification token in the URL. Check the link in your email again.</p>
      <a class="btn" href="index.html">Back to Fundukuzama</a>
    `;
    return;
  }
  try {
    const res = await fetch(`${API_BASE_URL}/api/auth/verify-email?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!res.ok) {
      card.innerHTML = `
        <div class="icon">⚠️</div>
        <h1>Couldn't verify your email</h1>
        <p>${data.error || 'This link may have expired.'}</p>
        <a class="btn" href="fundukuzama-signup.html">Back to signup</a>
      `;
      return;
    }
    // Store session token so the store site knows you're signed in.
    localStorage.setItem('fundukuzama_token', data.token);
    card.innerHTML = `
      <div class="icon">✅</div>
      <h1>You're verified!</h1>
      <p>Your Fundukuzama account is active. Taking you to your dashboard…</p>
      <a class="btn" href="index.html#dashboard">Go to my dashboard</a>
    `;
    setTimeout(() => { window.location.href = 'index.html#dashboard'; }, 2000);
  } catch (err) {
    console.error('Verification error:', err);
    card.innerHTML = `
      <div class="icon">⚠️</div>
      <h1>Couldn't reach the server</h1>
      <p>The backend may be waking up from sleep — wait 30 seconds and try refreshing this page.</p>
      <button class="btn" onclick="window.location.reload()">Retry</button>
    `;
  }
}
verify();
</script>
</body>
</html>
